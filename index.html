<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VolleyStat" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>VolleyStat</title>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:system-ui,sans-serif;background:#0b1120;color:#e8eefc">
        <div style="font-size:48px">🏐</div>
        <div id="boot-msg">Chargement de VolleyStat…</div>
      </div>
    </div>
    <script>
      // Écran de secours si l'appli ne démarre pas (ancienne version en cache, erreur…)
      (function () {
        function fail(detail) {
          if (window.__booted) return;
          var box = document.getElementById('boot-msg');
          if (!box) return;
          box.innerHTML =
            '<p style="margin:0 0 12px">L\u2019appli n\u2019a pas pu démarrer.</p>' +
            '<button id="boot-reset" style="font:inherit;font-weight:700;padding:14px 20px;border:0;border-radius:12px;background:#facc15;color:#1a1400">Recharger la dernière version</button>' +
            '<p style="margin:12px 0 0;font-size:13px;opacity:.7">Tes équipes et matchs ne sont pas effacés.</p>' +
            (detail ? '<p style="margin:12px 0 0;font-size:12px;opacity:.5;word-break:break-word">' + String(detail).replace(/</g, '&lt;') + '</p>' : '');
          document.getElementById('boot-reset').onclick = function () {
            var jobs = [];
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?v=' + Date.now()); });
          };
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) fail('Fichier introuvable : ' + (t.src || t.href));
          else fail(e.message);
        }, true);
        setTimeout(function () { fail(''); }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
